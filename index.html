<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tandem — Couples Organizer</title>
  <meta name="description" content="Make your girlfriend happy - with Tandem." />

  <meta property="og:title" content="Tandem — Couples Organizer" />
  <meta property="og:description" content="Make your girlfriend happy with Tandem." />
  <meta property="og:type" content="website" />

  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div class="wrap">
    <header class="header">
      <a class="brand" href="#">
        <img src="assets/logo.png" alt="Tandem logo" />
        <span class="brandText">Tandem</span>
      </a>
    </header>

    <main class="hero">
      <section class="heroLeft">
        <h1 class="claim">
          Organize your relationship better<br />
          with Tandem.
        </h1>

        <p class="sub">
          Tandem is a mobile app (in development) that helps you stay on top of todos, calendar events, and even finances with your partner.
        </p>

        <form id="waitlist" class="waitlist" autocomplete="on">
          <!-- Honeypot (optional anti-bot). Hidden via CSS. -->
          <input type="text" name="website" id="website" tabindex="-1" autocomplete="off" aria-hidden="true" class="hp" />

          <div class="field" aria-label="Join waitlist">
            <span class="icon" aria-hidden="true">✉️</span>

            <input
              id="email"
              required
              type="email"
              name="email"
              placeholder="Enter your email for the waitlist"
              autocomplete="email"
            />

            <button class="btn" type="submit">Join waitlist</button>
          </div>

          <div class="status" id="status" role="status" aria-live="polite"></div>
        </form>
      </section>

      <section class="heroRight" aria-label="Mobile video preview placeholder">
        <div class="phone">
          <div class="videoPlaceholder">
            <div class="play">
              <div class="triangle" aria-hidden="true"></div>
            </div>
            <p class="videoLabel">Video preview</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>© <span id="year"></span> Tandem</span>
      <a href="privacy.html">Privacy</a>
    </footer>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
